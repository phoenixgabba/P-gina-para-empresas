name: FORMA checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test server/test/security.test.mjs
      - run: find . -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
