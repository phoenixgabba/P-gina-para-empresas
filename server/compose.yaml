services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: forma
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    env_file: .env
    environment:
      UPLOAD_DIR: /var/lib/forma/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads:/var/lib/forma/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  db:
  uploads:
